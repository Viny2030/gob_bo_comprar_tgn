name: Tests Automáticos

on:
  pull_request:
    branches: [ desarrollo ]
  push:
    branches: [ desarrollo ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install pytest pandas openpyxl fastapi httpx asyncpg pydantic

      - name: Correr tests
        run: |
          pytest test_auditoria.py -v
