name: Monitor Diario desde Argentina (runner propio)

# RESPALDO de ejecucion_diaria.yml, que desde el 03/11/2026 corre en GitHub con
# un proxy en Argentina (BORA_PROXY_URL). Este corre en el runner self-hosted de
# la PC (etiqueta `argentina`) con la conexión de la PC, y usa el mismo script
# (tools/actualizar_desde_pc.py): si el de GitHub ya generó el día, no hace nada.
#
# Va una hora después del de GitHub para no generar el mismo día a la vez. Si la
# PC está apagada, la corrida queda en cola hasta 24 h y se ejecuta al prenderla.
# Grupo de concurrencia propio: una corrida en cola esperando a la PC no debe
# frenar a la de GitHub.

on:
  schedule:
    - cron: '30 12 * * 1-5'  # 09:30 Argentina
    - cron: '30 16 * * 1-5'  # 13:30 Argentina: reintento (si ya está el reporte, no hace nada)
  workflow_dispatch:
    inputs:
      desde:
        description: 'Primer día a revisar (AAAA-MM-DD)'
        required: false
        default: '2026-10-21'

permissions:
  contents: write

concurrency:
  group: monitor-diario-argentina
  cancel-in-progress: false

jobs:
  run-analysis:
    runs-on: [self-hosted, argentina]
    timeout-minutes: 120

    steps:
      - name: Descargar código (Checkout)
        uses: actions/checkout@v4
        with:
          ref: desarrollo
          fetch-depth: 0

      # actions/setup-python falla en este runner: su instalador corre `./setup.ps1`
      # con powershell.exe y la política de ejecución de scripts de la PC lo bloquea
      # (corridas del 02/11/2026). El runner es un servicio de NETWORK SERVICE, que
      # tampoco ve el Python instalado en el perfil del usuario. Por eso se usa el
      # paquete NuGet oficial de python.org (un zip con python.exe y pip), bajado
      # una sola vez a la caché de herramientas del runner, y pasos en cmd: nada
      # de esto ejecuta scripts de PowerShell.
      - name: Preparar Python
        shell: cmd
        env:
          PY_VERSION: '3.13.17'
        run: |
          set "PYDIR=${{ runner.tool_cache }}\monitor-python\%PY_VERSION%"
          if not exist "%PYDIR%\tools\python.exe" (
            if not exist "%PYDIR%" mkdir "%PYDIR%" || exit /b 1
            curl.exe -fsSL -o "%PYDIR%\python.zip" "https://api.nuget.org/v3-flatcontainer/python/%PY_VERSION%/python.%PY_VERSION%.nupkg" || exit /b 1
            rem tar.exe de Windows (bsdtar) abre .zip; el tar de Git no, por eso la ruta completa
            "%SystemRoot%\System32\tar.exe" -xf "%PYDIR%\python.zip" -C "%PYDIR%" || exit /b 1
            del "%PYDIR%\python.zip"
          )
          "%PYDIR%\tools\python.exe" --version || exit /b 1
          echo PYTHON_MONITOR=%PYDIR%\tools\python.exe>> "%GITHUB_ENV%"

      - name: Instalar librerías
        shell: cmd
        run: |
          "%PYTHON_MONITOR%" -m pip install --disable-pip-version-check -q --upgrade pip || exit /b 1
          "%PYTHON_MONITOR%" -m pip install --disable-pip-version-check -q -r requirements.txt || exit /b 1

      - name: Generar y publicar los reportes que falten
        shell: cmd
        env:
          TGN_TOKEN: ${{ secrets.TGN_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          git config user.name "Robot Monitor" || exit /b 1
          git config user.email "robot@noreply.github.com" || exit /b 1
          "%PYTHON_MONITOR%" -W ignore tools/actualizar_desde_pc.py --publicar --desde "${{ github.event.inputs.desde || '2026-10-21' }}"

      - name: Notificar fallo
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          to: ${{ secrets.MAIL_TO }}
          from: Monitor BORA <${{ secrets.MAIL_USER }}>
          subject: "Monitor diario (Argentina) FALLO"
          body: |
            La corrida desde el runner de Argentina falló.

            Ver logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
